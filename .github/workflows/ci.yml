name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: scripts/bundle.sh
